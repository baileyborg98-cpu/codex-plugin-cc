<title>Beat Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0D0D0D; --surface:#16130F; --raise:#1F1A14; --line:#2E2820;
  --gold:#D4BC94; --gold-soft:rgba(212,188,148,.13); --gold-line:rgba(212,188,148,.3);
  --text:#EBE0CF; --muted:#968B7E; --done:#7FA37A;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#E7DCC9; --surface:#F5EFE4; --raise:#EDE4D4; --line:#D6C8AF;
    --gold:#8A6B3D; --gold-soft:rgba(138,107,61,.1); --gold-line:rgba(138,107,61,.32);
    --text:#16130F; --muted:#6B6154; --done:#4C6B47;
    --shadow:0 1px 0 rgba(255,255,255,.6) inset;
  }
}
:root[data-theme="light"]{
  --ground:#E7DCC9; --surface:#F5EFE4; --raise:#EDE4D4; --line:#D6C8AF;
  --gold:#8A6B3D; --gold-soft:rgba(138,107,61,.1); --gold-line:rgba(138,107,61,.32);
  --text:#16130F; --muted:#6B6154; --done:#4C6B47;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; margin:0;
  padding-block:22px 64px; padding-left:18px; padding-right:18px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto}

header{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
h1{
  font-family:Montserrat,Inter,sans-serif; font-weight:800; font-size:30px;
  letter-spacing:-.02em; line-height:1.05; margin:0; text-wrap:balance;
}
.sub{color:var(--muted);font-size:13px;margin:5px 0 0}
#themeBtn{
  flex:none;background:var(--surface);color:var(--muted);border:1px solid var(--line);
  border-radius:999px;width:36px;height:36px;font-size:15px;cursor:pointer;line-height:1;
}
#themeBtn:hover{color:var(--gold);border-color:var(--gold-line)}

.meter{display:flex;flex-direction:column;gap:7px}
.meterhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
.meterhead b{font-family:Montserrat,sans-serif;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.meterhead span{color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-size:11px}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0;background:var(--gold);transition:width .35s ease}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font:500 12.5px Inter,sans-serif; background:transparent; color:var(--muted);
  border:1px solid var(--line); border-radius:999px; padding:6px 13px; cursor:pointer;
}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--ground);border-color:var(--gold);font-weight:600}

.cards{display:flex;flex-direction:column;gap:14px}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
}
.card.done{opacity:.5}

.chead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fmt{
  font:600 10.5px Montserrat,sans-serif; letter-spacing:.13em; text-transform:uppercase;
  color:var(--gold); background:var(--gold-soft); border-radius:4px; padding:4px 8px;
}
.dur{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.num{margin-left:auto;font:600 11.5px Montserrat,sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}

.onscreen{border-left:2px solid var(--gold-line);padding-left:12px}
.lbl{
  font:600 10px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:4px;
}
.onscreen p{margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:16px;line-height:1.3;text-wrap:balance}

.beats{display:grid;grid-template-columns:auto 1fr;gap:3px 13px;align-items:baseline}
.t{font:600 12px Montserrat,sans-serif;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.l{margin:0;font-size:14.5px;line-height:1.45}

.fix{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:8px;padding:12px 14px}
.fix ul{margin:0;padding-left:17px}
.fix li{margin:2px 0;font-size:14px;line-height:1.45}
.fix li::marker{color:var(--gold)}

.land{background:var(--raise);border-radius:8px;padding:12px 14px}
.land p{margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:16.5px;line-height:1.3;text-wrap:balance}

.motion{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.motion b{color:var(--text);font-weight:600}

.foot{display:flex;gap:8px;padding-top:2px}
.btn{
  font:500 13px Inter,sans-serif;border-radius:8px;padding:9px 14px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted);
}
.btn:hover{color:var(--text);border-color:var(--gold-line)}
.btn.mark[aria-pressed="true"]{background:var(--gold-soft);color:var(--done);border-color:var(--gold-line);font-weight:600}
.foot .copy{margin-left:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.empty{color:var(--muted);text-align:center;padding:44px 0;font-size:14px}
.note{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div class="topline">
    <div>
      <h1>Beat Clock</h1>
      <p class="sub">38 scripts. Claim first, fix by ten seconds, out by twenty five.</p>
    </div>
    <button id="themeBtn" type="button" aria-label="Switch theme">◐</button>
  </div>
  <div class="meter">
    <div class="meterhead"><span>Filmed</span><b id="count">0 / 38</b></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="cards" id="cards"></div>
<p class="note" id="note">Marking a script filmed saves it for you across your devices.</p>
</div>

<script>
const DECK = "decks/beatclock-sep26";

const S = [
// ================= EDUCATION =================
{g:"Education",f:"Claim",os:"your cardio is why you're getting softer",b:[
["0:00","Your cardio is the reason you're getting softer."],
["0:03","Less food and more work, so your body went looking"],["0:06","for something to burn,"],
["0:08","and muscle was the cheapest thing in the building."],
["0:11","You're burning the furniture to heat the house."],
["0:14","So swap three cardio sessions for three lifts,"],
["0:17","and walk ten minutes after every meal."]],
fix:["3 cardio sessions become 3 lifts","10 minute walk after every meal","Keep any cardio you actually enjoy"],
land:"Same hours. Different body. Start this week.",
m:"Hard cut on every beat for the first six seconds. Furniture line drops right down, then straight back up for the swap."},

{g:"Education",f:"Claim",os:"tracking is why you're scared of food",b:[
["0:00","Tracking every gram is the reason you're scared of food."],
["0:04","Your brain doesn't know it's a diet."],["0:06","It knows an alarm goes off every time you eat,"],
["0:09","so dinner started feeling like a threat."],
["0:12","So track four days a week instead of seven,"],["0:15","weigh nothing green, ever,"],
["0:17","and one meal a week goes untracked with your phone in another room."]],
fix:["Track 4 days a week, not 7","Weigh nothing green","1 untracked meal a week, phone away"],
land:"Four days a week. Nothing green. Start tonight.",
m:"Kitchen, scales in shot the whole time, never mentioned. Push them away on the last beat."},

{g:"Education",f:"Claim",os:"7 days a week is why you look the same",b:[
["0:00","Training seven days a week is the reason you look the same."],
["0:04","The session is the ask."],["0:06","The growing happens after, asleep and eating."],
["0:09","You've put the request in daily and never let one get filled."],
["0:13","So drop to four sessions."],
["0:15","Every muscle twice a week. Two to six sets, five to eight reps."],
["0:20","Three full days off and you do nothing on them."]],
fix:["4 sessions a week, not 7","Each muscle twice a week","2 to 6 sets, 5 to 8 reps, 2 min rest"],
land:"Four days will beat seven. Give it a month.",
m:"Film leaving the gym, walking to the car. Numbers said slowly, they're the screenshot."},

{g:"Education",f:"Satire",os:"You NEED 10,000 steps a day (struck through) actually, not really",b:[
["0:00","If you want to be healthy there's a number, and it's ten thousand."],
["0:04","Not nine and a half. Ten."],
["0:07","So at half eleven at night, on nine thousand six hundred,"],
["0:10","you get your shoes back on and do laps of your kitchen island"],
["0:14","like a man being punished, until the watch buzzes."],
["0:18","That's what the watch has got you thinking anyway."],
["0:21","Ten thousand came from a pedometer advert in the sixties."],
["0:25","Find last week's average. Add two thousand. That's your number."]],
fix:["Find last week's daily average","Add 2,000","Review it monthly, ignore the 10k"],
land:"You were doing laps of your kitchen for an advert.",
extra:"Comment door: Tell me the dumbest number your watch has made you chase.",
m:"Film the laps for real, late. Dead straight until 0:18, then drop the bit and just talk."},

{g:"Education",f:"Satire",os:"If you're not sore it didn't work (struck through) actually, not really",b:[
["0:00","The only way to know a session worked"],["0:02","is if you can't sit down the next day."],
["0:05","Getting downstairs like a normal person? That was a warm up."],
["0:09","You want to be gripping the bannister."],
["0:11","And if you're not sore by Wednesday, back in, do it again."],
["0:15","That's what they've got you thinking anyway."],
["0:18","I haven't been sore in two years and I've never lifted heavier."],
["0:22","Judge it on one thing. Did the weight go up, or the reps."],
["0:26","Write both down. Beat one next week."]],
fix:["Log weight and reps every set","Beat one number next session","Ignore soreness completely"],
land:"Soreness says it was new. The logbook says it worked.",
m:"Sofa. Do the struggle getting up during the setup. Earnest until the turn."},

{g:"Education",f:"Confession",os:"90g of protein. six days a week of training.",b:[
["0:00","I trained six days a week for two years on ninety grams of protein."],
["0:04","Ninety."],["0:06","Six foot, lifting heavy, eating like a bird,"],
["0:09","wondering why I looked the same every January."],
["0:12","You can't ask a builder for a house and hand him a bag of sand."],
["0:16","So, bodyweight in kilos, times two. That's your grams, daily."],
["0:21","Split over four meals. Change nothing else for six weeks."]],
fix:["Bodyweight in kg x 2 = daily protein grams","Split across 4 meals","Change nothing else for 6 weeks"],
land:"Kilos times two. Go and work yours out.",
m:"Kitchen, making food. Say 'ninety' alone with a pause either side."},

{g:"Education",f:"Claim",os:"5 hours a night is why nothing's changing",b:[
["0:00","Five hours a night is the reason nothing's changing."],
["0:03","I did it for three years and wore it like a badge."],
["0:07","Sleep is when the work gets banked."],
["0:09","I was making the deposit daily and never letting one clear."],
["0:13","So, same wake time every day, weekends included."],
["0:16","Phone charges in another room."],
["0:18","In bed seven and a half hours before that alarm."]],
fix:["Same wake time 7 days a week","Phone charges outside the bedroom","In bed 7.5 hours before the alarm"],
land:"Two weeks of that. Everything else gets easier.",
m:"Film late, low light, genuinely tired. Energy drops on the banking line, back up for the fix."},

{g:"Education",f:"Confession",os:"4 years of dieting. never lean.",b:[
["0:00","I dieted on and off for four years and never got lean."],
["0:04","Never fat either. Just permanently slightly hungry."],
["0:08","A body doesn't change while it's being squeezed."],
["0:11","It changes after, when it believes food's coming back."],
["0:14","So go and find maintenance. Women, fifties, two thousand."],
["0:18","Sixties, twenty one hundred. Seventies, twenty two hundred."],
["0:22","Men add three to five hundred. Hold it two weeks."]],
fix:["50s 2000 / 60s 2100 / 70s 2200 kcal","Men add 300 to 500","Hold 2 weeks, judge the weekly trend"],
land:"Six months there beat four years of cutting.",
m:"Sat down, calm. Put the numbers on screen as you say them, this one gets saved."},

{g:"Education",f:"Claim",os:"changing programme is why nothing gets heavy",b:[
["0:00","Changing your programme every four weeks is why nothing gets heavy."],
["0:04","I did it for years. New split, new exercises, new spreadsheet."],
["0:09","Got very good at starting things."],
["0:11","Nothing ever got old, so nothing ever got heavy."],
["0:14","So pick one and run it twelve weeks."],
["0:17","Same lifts, same order, write down every set."],
["0:20","Next week you beat one number on that page."]],
fix:["One programme, 12 weeks minimum","Same lifts, same order every week","Log every set, beat one number weekly"],
land:"Twelve weeks. One notebook. Beat the page.",
m:"Gym, between sets. Self mocking on the spreadsheet line."},

{g:"Education",f:"Confession",os:"the least impressive thing that worked",b:[
["0:00","The thing that changed my body most was walking."],
["0:03","Which is the least impressive sentence I have ever said."],
["0:07","For years I did brutal cardio three times a week"],
["0:10","and sat down for the other hundred hours."],
["0:13","So here's the whole thing, and there's nothing to book."],
["0:16","Ten after breakfast. Ten after lunch. Ten after dinner."],
["0:21","Do only that for a month before you change anything else."]],
fix:["10 minute walk after each meal","Nothing to schedule or recover from","Give it a month before changing anything"],
land:"Thirty minutes, in three bits. Starts tonight.",
m:"Film it walking. Handheld, outdoors, slightly out of breath helps."},

{g:"Education",f:"Confession",os:"5 years scared of one kilo",b:[
["0:00","I was scared of gaining one kilo for five years."],
["0:03","So I never ate enough to build anything."],
["0:06","Same weight. Same shape. Half a decade."],
["0:09","And I called it discipline."],
["0:11","You cannot build something out of nothing."],
["0:14","So, eight weeks at maintenance, minimum."],
["0:17","Weigh twice a week, same morning, average only."],
["0:20","Expect one to two kilos early and leave it alone."]],
fix:["8 weeks at maintenance minimum","Weigh twice a week, same morning","Judge the average, never a single day"],
land:"Eight weeks. Average only. Don't flinch.",
m:"'Same weight, same shape, half a decade' goes flat and fast, like a stuck record."},

{g:"Education",f:"Client story",os:"her calculator said 1700. it was 3000.",b:[
["0:00","Her calculator said maintenance was seventeen hundred."],
["0:04","It was over three thousand."],
["0:06","She'd spent two years eating fourteen hundred,"],
["0:09","permanently hungry, permanently stuck,"],
["0:12","calling herself lazy for not losing weight."],
["0:15","So stop asking a website."],
["0:17","Add a hundred calories a day to what you eat now."],
["0:20","Hold two weeks. Still dropping? Add another hundred."]],
fix:["Add 100 kcal a day to what you eat now","Hold 2 weeks, check the trend","Still dropping? Add another 100"],
land:"Add a hundred. Wait a fortnight. Repeat.",
m:"Say 'over three thousand' and let it sit. Then straight into the method, brisk."},

{g:"Education",f:"Claim",os:"your deficit became your maintenance",b:[
["0:00","The reason the weight stopped is your deficit became your maintenance."],
["0:05","You were in it long enough that the body adapted."],
["0:08","Moves less, burns less, runs the whole operation on less."],
["0:12","So you go up, not down."],
["0:14","Two weeks at maintenance. You won't gain fat, you'll refill."],
["0:18","Then five weeks back in a deficit and it moves again."]],
fix:["2 weeks at maintenance now","Then 5 weeks in a deficit","Repeat 5 on / 2 off"],
land:"Five on, two off. Cutting harder is what stuck you.",
m:"Flat and certain. People argue with this one, so say the numbers like they're settled."},

{g:"Education",f:"Claim",os:"the scale goes up and that's the good news",b:[
["0:00","When I put someone on their real maintenance the scale goes up a kilo."],
["0:05","Every time. And every time, they panic."],
["0:08","That's glycogen. Muscles refilling with fuel and water"],
["0:12","after years of running on empty."],
["0:14","So don't weigh yourself at all for five days."],
["0:17","Start day six, same morning, weekly average only."],
["0:21","And if it never happens, you still haven't eaten enough."]],
fix:["No weigh ins for 5 days","Restart day 6, same morning","Weekly average only"],
land:"Skip five days. Average from day six.",
m:"Next to a scale but never on it. Calm, reassuring. This one's for the person who's frightened."},

{g:"Education",f:"Claim",os:"once a week is why it isn't growing",b:[
["0:00","Training a muscle once a week is why it isn't growing."],
["0:04","Protein synthesis runs about forty eight hours after you train it."],
["0:08","Then it stops, and the muscle goes the other way."],
["0:11","Two days building. Five days giving it back."],
["0:14","So split the sets you already do across two days."],
["0:17","Chest Monday and Thursday. Two to six sets each time."]],
fix:["Split existing sets across 2 days","2 to 6 sets per muscle per session","5 to 8 reps"],
land:"Same sets. Same gym time. Twice the growing.",
m:"Gym, count the days out on your hand. Slow down on the five days line."},

{g:"Education",f:"Claim",os:"destroying yourself is why you're not growing",b:[
["0:00","Destroying yourself in the gym is why you're not growing."],
["0:04","I did two hours, everything to failure, barely walked out."],
["0:08","Your body's first job is getting back to where it started."],
["0:12","Only what's left after that builds anything new."],
["0:15","So cap it. Two to six sets per muscle, per session."],
["0:19","Five to eight reps, two minutes rest."],
["0:21","Only the last set of each exercise goes to failure."]],
fix:["2 to 6 working sets per muscle","5 to 8 reps, 2 min rest","Only the last set goes to failure"],
land:"More isn't better. Better is better.",
m:"Gym car park after a session. Rueful, taking the piss out of your younger self."},

{g:"Education",f:"Claim",os:"your metabolism is not broken",b:[
["0:00","Your metabolism is not broken."],
["0:02","If you're in your forties and everything stopped working, hear me."],
["0:06","Energy balance doesn't stop being physics"],
["0:09","because your hormones are all over the place."],
["0:12","Estrogen's dropping, so recovery's slower and the scale's holding water"],
["0:16","that's hiding fat you have genuinely already lost."],
["0:19","So protein goes to two grams per kilo, over four meals."],
["0:23","Lift three times a week, five to eight reps."],
["0:26","And sleep stops being the thing you cut when you get busy."]],
fix:["Protein 2g per kg, across 4 meals","Lift 3x a week, 5 to 8 reps","Sleep becomes non negotiable"],
land:"It was never effort. Change those and watch.",
m:"Straight to camera, sat down, no gym. The most important script here and it should look the least produced."},

// ================= LIFE =================
{g:"Life",f:"Sequence",os:"training with a 7 month old",b:[
["0:00","This is what training looks like with a seven month old."],["0:02","Up at five, because she's up at five."],
["0:04","Coffee, one handed."],["0:06","Pram out the door by half six."],
["0:08","Forty minutes round the park while she sleeps."],["0:10","Home, breakfast, handover."],["0:12","Gym at eight."],
["0:14","In and out in fifty minutes."],["0:16","Four lifts, phone in the bag."]],
land:"And I haven't been motivated once this year.",
m:"Every beat is a real shot, so film across one actual morning and cut it later. No talking head anywhere. Land over the last frame, flat."},

{g:"Life",f:"Sequence",os:"a saturday",b:[
["0:00","Saturday with a baby and a business."],["0:02","Awake ten past five."],["0:04","Two coffees before six."],
["0:06","Emails done before she's properly up."],["0:08","Park by eight, swings, the lot."],
["0:10","She naps at eleven, I train in the garage."],["0:13","Lunch, the three of us."],["0:15","Laptop shut for the rest of it."]],
land:"And I never once had to ask anyone if I could.",
m:"Real footage across a real Saturday. Keep the beats boring on purpose, the pictures do it. Land is quiet."},

{g:"Life",f:"Observation",os:"every hotel gym on earth",b:[
["0:00","Every hotel gym on earth is the same room, isn't it."],["0:03","Two dumbbells."],
["0:05","And they go three kilos to forty with nothing in between."],["0:09","One treadmill with a sign on it."],
["0:12","A machine nobody has ever once identified."],["0:15","Full length mirror down one wall,"],
["0:17","so you can watch yourself curl three kilos"],["0:19","in front of a water cooler with no cups in it."]],
land:"Cracking facilities.",
m:"Film in an actual hotel gym, wide shots, pan across each thing as you name it. Land over the sign on the treadmill. Flat, no smile."},

{g:"Life",f:"Observation",os:"nobody has ever done the tray correctly",b:[
["0:00","Nobody has ever put their stuff in an airport tray correctly. Nobody."],
["0:04","You get the tray, you're calm, you've got this."],["0:07","Belt off, laptop out, fine."],
["0:09","Then you remember the liquids."],
["0:12","And there's a bloke behind you who's packed for this exact moment,"],["0:15","he's through, shoes on, gone."],
["0:18","And you're stood there holding a belt and a bag of shampoo"],["0:21","like you've been arrested."]],
land:"Twenty eight years old. Still can't do a tray.",
m:"Airport, handheld, film in the actual queue if you can get away with it. Speed up through the middle, land it dead slow."},

{g:"Life",f:"Observation",os:"nobody folds a pram first go",b:[
["0:00","Nobody has ever folded a pram on the first go."],["0:03","There's a button."],["0:05","There's a lever."],
["0:07","And they've got to be done together,"],["0:09","in an order that nobody tells you, anywhere."],
["0:12","So you're crouched in a car park doing keyhole surgery"],["0:15","while your wife holds the baby"],
["0:17","and a bloke in the next bay watches the whole thing happen."]],
land:"It folded fine in the shop.",
m:"Car park, phone on the roof of the car, you genuinely wrestling it. Do not cut the failure. Land over you still crouched."},

{g:"Life",f:"Pub yap",os:"2022, one way",b:[
["0:00","People ask me about the move all the time,"],
["0:03","and the bit nobody believes is that I had nothing lined up."],
["0:07","Nothing, mate."],["0:09","No job. No flat."],
["0:11","A mate's sofa for a fortnight and after that, genuinely no idea."],
["0:16","And everyone had the same question for me."],["0:18","What if it doesn't work."],
["0:21","Over and over. Same question, everyone."],
["0:24","Not one person, in months, asked me what if it does."]],
land:"Four years on there's a wife and a daughter in that answer.",
m:"Airport or a window seat if you've got the footage. Land goes over something real, her or the flat, not your face."},

{g:"Life",f:"Pub yap",os:"how the work actually fits",b:[
["0:00","Right, people always want to know how the work fits when we're away."],
["0:04","It's mental, honestly."],["0:06","I'm up at two in the morning."],
["0:08","Two. Laptop, dark room, coffee, nobody awake anywhere on earth."],
["0:13","Six hours straight and then it's shut."],["0:16","And everyone pulls a face when I tell them,"],
["0:19","but that's six hours for the entire day back."]],
land:"I'd make that trade every week of my life.",
m:"Film the actual 2am, dark room, laptop glow. Then cut hard to daylight for the land."},

{g:"Life",f:"Pub yap",os:"everything stopped",b:[
["0:00","Right, she's asleep on me and I genuinely cannot move."],

const GROUPS = ["All","Education","Life","Motivation","Snowboard"];
let active = "All";
let filmed = {};
let ref = null;

const key = i => "s" + i;
const dur = s => { const p = s.b[s.b.length-1][0].split(":"); return (+p[0]*60 + +p[1] + 4) + "s"; };

function plain(s){
  let t = "ON SCREEN: " + s.os + "\n\n";
  t += s.b.map(x => x[0] + "  " + x[1]).join("\n");
  if (s.fix) t += "\n\nDO THIS:\n" + s.fix.map(f => "- " + f).join("\n");
  t += "\n\nLAND: " + s.land;
  if (s.extra) t += "\n" + s.extra;
  t += "\n\nDELIVERY: " + s.m;
  return t;
}

function drawChips(){
  const el = document.getElementById("chips");
  el.textContent = "";
  GROUPS.forEach(g => {
    const n = g === "All" ? S.length : S.filter(s => s.g === g).length;
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(g === active));
    b.textContent = g + " " + n;
    b.onclick = () => { active = g; drawChips(); draw(); };
    el.appendChild(b);
  });
}

function block(cls, label, build){
  const d = document.createElement("div");
  d.className = cls;
  const l = document.createElement("span"); l.className = "lbl"; l.textContent = label;
  d.appendChild(l); build(d); return d;
}

function card(s,i){
  const done = !!filmed[key(i)];
  const c = document.createElement("article");
  c.className = "card" + (done ? " done" : "");

  const head = document.createElement("div");
  head.className = "chead";
  const f = document.createElement("span"); f.className = "fmt"; f.textContent = s.f;
  const d = document.createElement("span"); d.className = "dur"; d.textContent = dur(s);
  const n = document.createElement("span"); n.className = "num"; n.textContent = String(i+1).padStart(2,"0");
  head.append(f,d,n); c.appendChild(head);

  c.appendChild(block("onscreen","On screen", d => {
    const p = document.createElement("p"); p.textContent = s.os; d.appendChild(p);
  }));

  const beats = document.createElement("div");
  beats.className = "beats";
  s.b.forEach(([t,l]) => {
    const ts = document.createElement("span"); ts.className = "t"; ts.textContent = t;
    const ls = document.createElement("p"); ls.className = "l"; ls.textContent = l;
    beats.append(ts,ls);
  });
  c.appendChild(beats);

  if (s.fix){
    c.appendChild(block("fix","Do this", d => {
      const ul = document.createElement("ul");
      s.fix.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
      d.appendChild(ul);
    }));
  }

  c.appendChild(block("land","Land", d => {
    const p = document.createElement("p"); p.textContent = s.land; d.appendChild(p);
    if (s.extra){
      const e = document.createElement("p");
      e.className = "motion"; e.style.marginTop = "9px"; e.textContent = s.extra;
      d.appendChild(e);
    }
  }));

  const m = document.createElement("p");
  m.className = "motion";
  const mb = document.createElement("b"); mb.textContent = "Delivery. ";
  m.append(mb, document.createTextNode(s.m));
  c.appendChild(m);

  const foot = document.createElement("div");
  foot.className = "foot";
  const mark = document.createElement("button");
  mark.type = "button"; mark.className = "btn mark";
  mark.setAttribute("aria-pressed", String(done));
  mark.textContent = done ? "Filmed" : "Mark filmed";
  mark.onclick = () => toggle(i);
  const copy = document.createElement("button");
  copy.type = "button"; copy.className = "btn copy"; copy.textContent = "Copy";
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(plain(s)); copy.textContent = "Copied"; }
    catch { copy.textContent = "Copy failed"; }
    setTimeout(() => { copy.textContent = "Copy"; }, 1400);
  };
  foot.append(mark, copy); c.appendChild(foot);
  return c;
}

function draw(){
  const box = document.getElementById("cards");
  box.textContent = "";
  const list = S.map((s,i) => [s,i]).filter(([s]) => active === "All" || s.g === active);
  if (!list.length){
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = "Nothing here yet.";
    box.appendChild(p); return;
  }
  list.forEach(([s,i]) => box.appendChild(card(s,i)));
  meter();
}

function meter(){
  const n = S.filter((_,i) => filmed[key(i)]).length;
  document.getElementById("count").textContent = n + " / " + S.length;
  document.getElementById("fill").style.width = (n / S.length * 100) + "%";
}

function toggle(i){
  const k = key(i);
  if (filmed[k]) delete filmed[k]; else filmed[k] = true;
  draw();
  if (ref) ref.set({ filmed: filmed }).catch(() => {
    document.getElementById("note").textContent = "That didn't save. Your marks are showing but they won't survive a reload.";
  });
}

document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
};

drawChips();
draw();

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db){
    document.getElementById("note").textContent = "Filmed marks won't save in this view, so they'll clear when you reload.";
    return;
  }
  ref = db.doc(DECK);
  ref.onSnapshot(
    snap => {
      const data = snap.exists ? snap.data() : null;
      filmed = (data && data.filmed && typeof data.filmed === "object") ? Object.assign({}, data.filmed) : {};
      draw();
    },
    () => { document.getElementById("note").textContent = "Lost the connection to your saved marks. Reload to try again."; }
  );
})();
</script>
