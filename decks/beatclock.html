<title>Beat Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0D0D0D; --surface:#16130F; --raise:#1F1A14; --line:#2E2820;
  --gold:#D4BC94; --gold-soft:rgba(212,188,148,.13); --gold-line:rgba(212,188,148,.3);
  --text:#EBE0CF; --muted:#968B7E; --done:#7FA37A;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#E7DCC9; --surface:#F5EFE4; --raise:#EDE4D4; --line:#D6C8AF;
    --gold:#8A6B3D; --gold-soft:rgba(138,107,61,.1); --gold-line:rgba(138,107,61,.32);
    --text:#16130F; --muted:#6B6154; --done:#4C6B47;
    --shadow:0 1px 0 rgba(255,255,255,.6) inset;
  }
}
:root[data-theme="light"]{
  --ground:#E7DCC9; --surface:#F5EFE4; --raise:#EDE4D4; --line:#D6C8AF;
  --gold:#8A6B3D; --gold-soft:rgba(138,107,61,.1); --gold-line:rgba(138,107,61,.32);
  --text:#16130F; --muted:#6B6154; --done:#4C6B47;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; margin:0;
  padding-block:22px 64px; padding-left:18px; padding-right:18px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto}

header{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
h1{
  font-family:Montserrat,Inter,sans-serif; font-weight:800; font-size:30px;
  letter-spacing:-.02em; line-height:1.05; margin:0; text-wrap:balance;
}
.sub{color:var(--muted);font-size:13px;margin:5px 0 0}
#themeBtn{
  flex:none;background:var(--surface);color:var(--muted);border:1px solid var(--line);
  border-radius:999px;width:36px;height:36px;font-size:15px;cursor:pointer;line-height:1;
}
#themeBtn:hover{color:var(--gold);border-color:var(--gold-line)}

.meter{display:flex;flex-direction:column;gap:7px}
.meterhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
.meterhead b{font-family:Montserrat,sans-serif;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.meterhead span{color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-size:11px}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0;background:var(--gold);transition:width .35s ease}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font:500 12.5px Inter,sans-serif; background:transparent; color:var(--muted);
  border:1px solid var(--line); border-radius:999px; padding:6px 13px; cursor:pointer;
}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--ground);border-color:var(--gold);font-weight:600}

.cards{display:flex;flex-direction:column;gap:14px}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
}
.card.done{opacity:.5}

.chead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fmt{
  font:600 10.5px Montserrat,sans-serif; letter-spacing:.13em; text-transform:uppercase;
  color:var(--gold); background:var(--gold-soft); border-radius:4px; padding:4px 8px;
}
.dur{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.num{margin-left:auto;font:600 11.5px Montserrat,sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}

.onscreen{border-left:2px solid var(--gold-line);padding-left:12px}
.lbl{
  font:600 10px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:4px;
}
.onscreen p{margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:16px;line-height:1.3;text-wrap:balance}

.beats{display:grid;grid-template-columns:auto 1fr;gap:3px 13px;align-items:baseline}
.t{font:600 12px Montserrat,sans-serif;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.l{margin:0;font-size:14.5px;line-height:1.45}

.fix{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:8px;padding:12px 14px}
.fix ul{margin:0;padding-left:17px}
.fix li{margin:2px 0;font-size:14px;line-height:1.45}
.fix li::marker{color:var(--gold)}

.land{background:var(--raise);border-radius:8px;padding:12px 14px}
.land p{margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:16.5px;line-height:1.3;text-wrap:balance}

.motion{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.motion b{color:var(--text);font-weight:600}

.foot{display:flex;gap:8px;padding-top:2px}
.btn{
  font:500 13px Inter,sans-serif;border-radius:8px;padding:9px 14px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted);
}
.btn:hover{color:var(--text);border-color:var(--gold-line)}
.btn.mark[aria-pressed="true"]{background:var(--gold-soft);color:var(--done);border-color:var(--gold-line);font-weight:600}
.foot .copy{margin-left:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.empty{color:var(--muted);text-align:center;padding:44px 0;font-size:14px}
.note{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div class="topline">
    <div>
      <h1>Beat Clock</h1>
      <p class="sub">38 scripts. Education ends with a job. Pub yaps end with a story.</p>
    </div>
    <button id="themeBtn" type="button" aria-label="Switch theme">◐</button>
  </div>
  <div class="meter">
    <div class="meterhead"><span>Filmed</span><b id="count">0 / 38</b></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="cards" id="cards"></div>
<p class="note" id="note">Marking a script filmed saves it for you across your devices.</p>
</div>

<script>
const DECK = "decks/beatclock-sep26";

const S = [
// ================= EDUCATION =================
{g:"Education",f:"Accusation",os:"45 mins of cardio a day",b:[
["0:00","Let me guess, forty five minutes of cardio a day,"],["0:02","and you're softer than you were in January."],
["0:04","You're softer because of the forty five minutes of cardio a day."],
["0:07","You gave your body less food and more work,"],["0:10","so it went looking for something to burn,"],
["0:12","and muscle was the cheapest thing in the building."],["0:15","You're burning the furniture to heat the house."],
["0:18","So here's the swap, and it's the same hour you already spend."],
["0:22","Three lifts a week, forty five minutes each."],
["0:25","Cardio drops to twice a week, twenty minutes, and only if you like it."],
["0:30","Everything you just freed up goes into walking."],["0:33","Ten minutes after every meal. Starts tonight."]],
fix:["3 lifts a week, 45 mins each","Cardio down to 2 x 20 mins","10 minute walk after every meal"],
land:"Same hour. Completely different body.",
m:"New angle every beat through the first ten seconds, that's where you bleed. Drop right down on the furniture line, then pick the pace back up for the fix."},

{g:"Education",f:"Accusation",os:"8 weeks of weighing everything",b:[
["0:00","Let me guess, eight weeks of weighing everything,"],["0:02","and you're more scared of food than when you started."],
["0:05","Your brain doesn't know it's a diet."],["0:07","It knows a number goes off every time you eat,"],
["0:10","so it's started treating dinner like a threat."],["0:13","Here's how you get out without losing the progress."],
["0:17","Track four days a week. Not seven."],["0:20","Weigh nothing green. Ever. No vegetable has ever made anyone fat."],
["0:25","And one meal a week goes completely untracked with your phone in another room."],
["0:30","Do that for a month and you'll know your portions without the app."]],
fix:["Track 4 days a week, not 7","Weigh nothing green","1 untracked meal a week, phone away"],
land:"Four days a week, and nothing green. Start tonight.",
m:"Kitchen, scales on the counter in shot the whole time, never mentioned. Push the scales away as you say the fix. That gesture is the video."},

{g:"Education",f:"Accusation",os:"in the gym 7 days a week",b:[
["0:00","Let me guess, seven days a week in that gym,"],["0:02","and you look identical to March."],
["0:04","You look identical because it's seven days a week."],["0:07","The training is the ask."],
["0:09","The growing happens after, while you're asleep and eating."],
["0:12","You've been putting the request in daily and never letting one get filled."],
["0:17","So cut it to four sessions."],["0:19","Every muscle twice a week instead of once."],
["0:22","Two to six hard sets per muscle per session."],["0:25","Five to eight reps, two minutes rest between."],
["0:29","Three full days off, and you do nothing on them."]],
fix:["4 sessions a week, not 7","Each muscle twice a week","2 to 6 sets, 5 to 8 reps","2 minutes rest minimum"],
land:"Four days will beat seven. Give it a month.",
m:"Film leaving the gym, walking to the car, so the visual argues while you talk. Say the numbers slowly, they're the bit people screenshot."},

{g:"Education",f:"Satire",os:"You NEED 10,000 steps a day (struck through) actually, not really",b:[
["0:00","If you want to be healthy there's a number,"],["0:02","and the number is ten thousand."],
["0:04","Not nine and a half."],["0:06","Ten."],
["0:08","So if you're on nine thousand six hundred at half eleven at night"],["0:11","you get your shoes back on,"],
["0:13","and you do laps of your kitchen island"],["0:15","like a man being punished,"],["0:17","until the watch buzzes."],
["0:20","Because nine thousand six hundred is a wasted day."],["0:24","That's what the watch has got you thinking anyway."],
["0:27","Ten thousand came from a pedometer advert in the sixties."],["0:31","So here's the actual move."],
["0:33","Open your health app, find last week's daily average."],["0:36","Add two thousand to it."],
["0:38","That's your number, and it's yours, not a marketing team's."]],
fix:["Find last week's daily average","Add 2,000","That's your target, review monthly"],
land:"Last week's average plus two thousand. That's it.",
extra:"Comment door: Tell me the dumbest number your watch has made you chase.",
m:"Film the kitchen laps for real, late, phone on the counter. Dead straight face until second twenty seven, then drop the bit entirely and just talk."},

{g:"Education",f:"Satire",os:"If you're not sore it didn't work (struck through) actually, not really",b:[
["0:00","The only way to know a session worked"],["0:02","is if you can't sit down the next day."],
["0:05","If you're getting down stairs like a normal person,"],["0:07","that was a warm up."],
["0:09","You want to be gripping the bannister."],["0:11","You want your wife laughing at you getting off the sofa."],
["0:14","And if you're not sore by Wednesday, back in, do it again."],
["0:18","That's what they've got you thinking anyway."],
["0:21","I haven't been properly sore in two years and I've never lifted heavier."],
["0:26","So judge a session on one thing only."],["0:28","Did the weight go up, or did you get an extra rep."],
["0:32","Write both down. Beat one of them next week."]],
fix:["Log weight and reps every set","Next session, beat one number","Ignore soreness entirely"],
land:"Soreness tells you it was new. The logbook tells you it worked.",
m:"Sofa. Actually do the struggle getting up during the setup. Play it earnest right until the turn, then talk straight."},

{g:"Education",f:"Confession",os:"I ate like a bird for two years",b:[
["0:00","I spent two years training six days a week"],["0:03","and eating about ninety grams of protein."],
["0:06","Ninety."],["0:08","Six foot, lifting heavy, eating like a bird,"],
["0:11","wondering why I looked the same every January."],
["0:14","You can't ask a builder for a house and hand him a bag of sand."],
["0:19","So here's your number, and you can work it out right now."],
["0:22","Your bodyweight in kilos, times two."],["0:25","That's your grams of protein, every single day."],
["0:28","Split it across four meals, so thirty to forty grams each."],
["0:32","Change nothing else for six weeks."]],
fix:["Bodyweight in kg x 2 = daily protein in grams","Split across 4 meals","Change nothing else for 6 weeks"],
land:"Bodyweight in kilos times two. Go and work yours out.",
m:"Kitchen, actually making food. Say 'ninety' on its own with a pause either side. Point at the camera on the number."},

{g:"Education",f:"Confession",os:"five hours a night for three years",b:[
["0:00","For three years I slept five hours a night and thought it was part of it."],
["0:04","Up early, train, work late, again."],["0:07","Wore it like a badge."],
["0:09","Sleep is when the work gets banked."],["0:11","I was making the deposit every day"],
["0:13","and never letting a single one clear."],["0:16","So here's the whole fix and it costs nothing."],
["0:19","Same wake time every day, weekends included."],["0:22","Phone charges in a different room, not on the bed."],
["0:26","And you're in bed seven and a half hours before that alarm goes."],
["0:30","Two weeks. That's all I'm asking for."]],
fix:["Same wake time 7 days a week","Phone charges outside the bedroom","In bed 7.5 hours before the alarm"],
land:"Fix this first. Everything else gets easier on its own.",
m:"Film late, low light, tired on purpose. Energy drops on the banking line, comes back for the fix."},

{g:"Education",f:"Confession",os:"I dieted for four years straight",b:[
["0:00","I dieted, on and off, for four years straight."],["0:04","Never fat, never lean, permanently slightly hungry."],
["0:08","I thought maintenance was for people who'd given up,"],["0:11","so I never spent one day there."],
["0:14","A body doesn't change much while it's being squeezed."],
["0:17","It changes after, when it believes food's coming back."],
["0:21","So go and find your maintenance."],["0:23","Rough starting point for women, by bodyweight."],
["0:26","Fifties, two thousand. Sixties, twenty one hundred. Seventies, twenty two hundred."],
["0:31","Men, add three to five hundred on top."],
["0:34","Eat that for two weeks and watch the weekly trend, not the daily number."]],
fix:["50s 2000 / 60s 2100 / 70s 2200 kcal","Men add 300 to 500","Hold 2 weeks, judge on weekly trend"],
land:"Six months at maintenance beat four years of cutting. Go find yours.",
m:"Sat down, calm, no gym. Put the numbers on screen as you say them, this one gets saved."},

{g:"Education",f:"Confession",os:"new programme every 4 weeks",b:[
["0:00","For years I changed my programme every four weeks."],["0:03","New split. New exercises."],
["0:06","New spreadsheet I was weirdly proud of."],["0:09","I got very good at starting things."],
["0:12","Nothing ever got heavy, because nothing ever got old."],
["0:16","So pick one programme and run it twelve weeks."],["0:19","Same lifts, same order, every single week."],
["0:22","Write the weight and the reps down for every set."],
["0:25","And next week your only job is beating one number on that page."]],
fix:["One programme, 12 weeks minimum","Same lifts, same order","Log every set, beat one number weekly"],
land:"Twelve weeks. One notebook. Beat the page.",
m:"Gym, between sets, phone propped on a bench. Slightly self mocking on the spreadsheet line."},

{g:"Education",f:"Confession",os:"the least impressive thing that worked",b:[
["0:00","The thing that changed my body most was not a programme."],["0:04","It was walking."],
["0:06","Least impressive sentence I've ever said out loud."],
["0:09","For years I did brutal cardio three times a week"],["0:12","and sat down for the other hundred hours."],
["0:16","So here's the whole thing, and there's no session to book."],
["0:20","Ten minutes after breakfast. Ten after lunch. Ten after dinner."],
["0:25","That's half an hour you don't have to schedule or recover from."],
["0:29","Do only that for a month before you change anything else."]],
fix:["10 minute walk after each meal","No sessions, no scheduling","Give it a month before changing anything else"],
land:"Thirty minutes, broken into three. Starts tonight.",
m:"Film it walking, obviously. Handheld, outdoors, mid walk. Slightly out of breath helps."},

{g:"Education",f:"Confession",os:"I was scared of gaining a single kilo",b:[
["0:00","I was scared of gaining one kilo for about five years."],
["0:04","Which meant I never ate enough to build anything."],
["0:07","Same weight. Same shape. Half a decade."],["0:11","And I called it discipline."],
["0:13","You cannot build something out of nothing."],
["0:16","So here's the deal you make with yourself."],["0:19","Eight weeks at maintenance, minimum, no negotiating."],
["0:23","Weigh in twice a week, same morning, and only ever look at the average."],
["0:28","Expect one to two kilos in the first fortnight and leave it alone."]],
fix:["8 weeks at maintenance, minimum","Weigh twice a week, same morning","Judge the average only, never a single day"],
land:"Eight weeks. Average only. Don't flinch.",
m:"Say the 'same weight, same shape, half a decade' beats flat and fast. They should feel like a stuck record."},

{g:"Education",f:"Client story",os:"her calculator said 1700",b:[
["0:00","Client came to me eating fourteen hundred calories a day."],
["0:04","Her calculator had told her maintenance was seventeen hundred,"],
["0:08","so she'd spent two years living just under that."],["0:11","Permanently hungry. Permanently stuck."],
["0:14","Her actual maintenance was over three thousand."],["0:17","Three thousand."],
["0:19","So stop asking a website and go and find yours."],
["0:22","Take what you're eating now and add a hundred calories a day."],
["0:26","Hold it two weeks. If the weight's still dropping, add another hundred."],
["0:31","Keep going until it holds steady. That's your number."],
["0:34","Took her four months. Worth every week of it."]],
fix:["Add 100 kcal a day to what you eat now","Hold 2 weeks, check the trend","Still dropping? Add another 100. Repeat."],
land:"Add a hundred. Wait a fortnight. Repeat.",
m:"Say 'three thousand' on its own and let it sit. Then straight into the method, brisk."},

{g:"Education",f:"Explainer",os:"why the weight stopped",b:[
["0:00","Everyone thinks a plateau means they've gone soft,"],["0:03","so they cut more."],
["0:05","Here's what's actually happened."],["0:07","You've been in a deficit long enough that the body adapted."],
["0:11","Moves less. Burns less. Runs the whole operation on less."],
["0:15","Your deficit quietly turned into your maintenance."],
["0:18","So you go up, not down."],["0:20","Two weeks at maintenance calories."],
["0:22","You won't gain fat, you'll refill."],
["0:25","Then back into a deficit for five weeks and it'll move again."],
["0:29","Five weeks on, two weeks off, for as long as you've got fat to lose."]],
fix:["2 weeks at maintenance now","Then 5 weeks deficit","Repeat 5 on / 2 off"],
land:"Cutting harder is what got you stuck. Go up for a fortnight.",
m:"Flat and matter of fact. This is the one people argue with in the comments, so say the numbers with total certainty."},

{g:"Education",f:"Explainer",os:"the scale went up and that's the good news",b:[
["0:00","When I put someone up to their real maintenance"],["0:03","the scale goes up a kilo or two."],
["0:06","Every time. And every time they panic."],["0:09","That weight is glycogen."],
["0:11","Your muscles filling back up with fuel and water"],["0:14","after years of running on empty."],
["0:17","So here's how you handle the week it happens."],
["0:20","Don't weigh yourself at all for the first five days."],
["0:24","Start again on day six, same morning, and only use a weekly average."],
["0:29","And if the jump never comes, you still haven't eaten enough."]],
fix:["No weigh ins for the first 5 days","Restart day 6, same morning each time","Weekly average only"],
land:"Skip five days of weigh ins. Average from day six.",
m:"Film next to a scale but don't stand on it. Calm, almost reassuring. This one's for the person who's frightened."},

{g:"Education",f:"Explainer",os:"chest day. once a week.",b:[
["0:00","If you're training a muscle once a week,"],["0:03","here's what happens in between."],
["0:05","Muscle protein synthesis runs about forty eight hours after you train it."],
["0:10","Then it stops, and the muscle starts going the other way."],
["0:14","So you get two days of building and five of giving it back."],
["0:18","Fix is free and you don't add a single session."],
["0:21","Take the sets you already do and split them over two days."],
["0:25","Chest Monday and Thursday instead of all of it on Monday."],
["0:29","Two to six sets each time, five to eight reps."]],
fix:["Split existing sets across 2 days","2 to 6 sets per muscle per session","5 to 8 reps"],
land:"Same sets. Same gym time. Twice the growing.",
m:"Gym, count the days out on your hand. The five days line lands, so slow down there."},

{g:"Education",f:"Confession",os:"more isn't better",b:[
["0:00","I used to think a session didn't count unless it destroyed me."],
["0:04","Two hours. Everything to failure. Barely walking out."],
["0:08","Your body's first job is getting back to where it started."],
["0:12","Only what's left after that builds anything new."],
["0:15","So I was spending everything repairing damage I'd caused on purpose."],
["0:20","So cap it, starting with your next session."],
["0:23","Two to six working sets per muscle, per session."],["0:26","Five to eight reps, two minutes rest."],
["0:29","Last set of each exercise goes to failure. Nothing before it does."]],
fix:["2 to 6 working sets per muscle","5 to 8 reps, 2 min rest","Only the last set goes to failure"],
land:"More isn't better. Better is better. Cap your sets.",
m:"Gym car park after a session, not during. Slightly rueful, you're taking the piss out of your younger self."},

{g:"Education",f:"Explainer",os:"your metabolism is not broken",b:[
["0:00","If you're in your forties and everything that used to work has stopped,"],
["0:04","hear me on this."],["0:06","Your metabolism is not broken."],
["0:08","Energy balance doesn't stop being physics"],["0:11","because your hormones are all over the place."],
["0:14","Estrogen's dropping, so you're less insulin sensitive, recovery's slower,"],
["0:19","and the scale's holding water that's hiding fat you have genuinely lost."],
["0:24","So three things change, and all three work."],
["0:27","Protein goes up. Two grams per kilo, spread over four meals."],
["0:32","Lift three times a week, heavy, five to eight reps."],
["0:35","And sleep stops being the thing you cut when you get busy."]],
fix:["Protein 2g per kg, across 4 meals","Lift 3x a week, 5 to 8 reps","Sleep becomes non negotiable"],
land:"It was never a lack of effort. Change those three and watch.",
m:"Straight to camera, sat down, no gym in shot. The most important script in the deck and it should look like the least produced."},

// ================= LIFE =================
{g:"Life",f:"Sequence",os:"training with a 7 month old",b:[
["0:00","This is what training looks like with a seven month old."],["0:02","Up at five, because she's up at five."],
["0:04","Coffee, one handed."],["0:06","Pram out the door by half six."],
["0:08","Forty minutes round the park while she sleeps."],["0:10","Home, breakfast, handover."],["0:12","Gym at eight."],
["0:14","In and out in fifty minutes."],["0:16","Four lifts, phone in the bag."]],
land:"And I haven't been motivated once this year.",
m:"Every beat is a real shot, so film across one actual morning and cut it later. No talking head anywhere. Land over the last frame, flat."},

{g:"Life",f:"Sequence",os:"a saturday",b:[
["0:00","Saturday with a baby and a business."],["0:02","Awake ten past five."],["0:04","Two coffees before six."],
["0:06","Emails done before she's properly up."],["0:08","Park by eight, swings, the lot."],
["0:10","She naps at eleven, I train in the garage."],["0:13","Lunch, the three of us."],["0:15","Laptop shut for the rest of it."]],
land:"And I never once had to ask anyone if I could.",

const GROUPS = ["All","Education","Life","Motivation","Snowboard"];
let active = "All";
let filmed = {};
let ref = null;

const key = i => "s" + i;
const dur = s => { const p = s.b[s.b.length-1][0].split(":"); return (+p[0]*60 + +p[1] + 4) + "s"; };

function plain(s){
  let t = "ON SCREEN: " + s.os + "\n\n";
  t += s.b.map(x => x[0] + "  " + x[1]).join("\n");
  if (s.fix) t += "\n\nDO THIS:\n" + s.fix.map(f => "- " + f).join("\n");
  t += "\n\nLAND: " + s.land;
  if (s.extra) t += "\n" + s.extra;
  t += "\n\nDELIVERY: " + s.m;
  return t;
}

function drawChips(){
  const el = document.getElementById("chips");
  el.textContent = "";
  GROUPS.forEach(g => {
    const n = g === "All" ? S.length : S.filter(s => s.g === g).length;
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(g === active));
    b.textContent = g + " " + n;
    b.onclick = () => { active = g; drawChips(); draw(); };
    el.appendChild(b);
  });
}

function block(cls, label, build){
  const d = document.createElement("div");
  d.className = cls;
  const l = document.createElement("span"); l.className = "lbl"; l.textContent = label;
  d.appendChild(l); build(d); return d;
}

function card(s,i){
  const done = !!filmed[key(i)];
  const c = document.createElement("article");
  c.className = "card" + (done ? " done" : "");

  const head = document.createElement("div");
  head.className = "chead";
  const f = document.createElement("span"); f.className = "fmt"; f.textContent = s.f;
  const d = document.createElement("span"); d.className = "dur"; d.textContent = dur(s);
  const n = document.createElement("span"); n.className = "num"; n.textContent = String(i+1).padStart(2,"0");
  head.append(f,d,n); c.appendChild(head);

  c.appendChild(block("onscreen","On screen", d => {
    const p = document.createElement("p"); p.textContent = s.os; d.appendChild(p);
  }));

  const beats = document.createElement("div");
  beats.className = "beats";
  s.b.forEach(([t,l]) => {
    const ts = document.createElement("span"); ts.className = "t"; ts.textContent = t;
    const ls = document.createElement("p"); ls.className = "l"; ls.textContent = l;
    beats.append(ts,ls);
  });
  c.appendChild(beats);

  if (s.fix){
    c.appendChild(block("fix","Do this", d => {
      const ul = document.createElement("ul");
      s.fix.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
      d.appendChild(ul);
    }));
  }

  c.appendChild(block("land","Land", d => {
    const p = document.createElement("p"); p.textContent = s.land; d.appendChild(p);
    if (s.extra){
      const e = document.createElement("p");
      e.className = "motion"; e.style.marginTop = "9px"; e.textContent = s.extra;
      d.appendChild(e);
    }
  }));

  const m = document.createElement("p");
  m.className = "motion";
  const mb = document.createElement("b"); mb.textContent = "Delivery. ";
  m.append(mb, document.createTextNode(s.m));
  c.appendChild(m);

  const foot = document.createElement("div");
  foot.className = "foot";
  const mark = document.createElement("button");
  mark.type = "button"; mark.className = "btn mark";
  mark.setAttribute("aria-pressed", String(done));
  mark.textContent = done ? "Filmed" : "Mark filmed";
  mark.onclick = () => toggle(i);
  const copy = document.createElement("button");
  copy.type = "button"; copy.className = "btn copy"; copy.textContent = "Copy";
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(plain(s)); copy.textContent = "Copied"; }
    catch { copy.textContent = "Copy failed"; }
    setTimeout(() => { copy.textContent = "Copy"; }, 1400);
  };
  foot.append(mark, copy); c.appendChild(foot);
  return c;
}

function draw(){
  const box = document.getElementById("cards");
  box.textContent = "";
  const list = S.map((s,i) => [s,i]).filter(([s]) => active === "All" || s.g === active);
  if (!list.length){
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = "Nothing here yet.";
    box.appendChild(p); return;
  }
  list.forEach(([s,i]) => box.appendChild(card(s,i)));
  meter();
}

function meter(){
  const n = S.filter((_,i) => filmed[key(i)]).length;
  document.getElementById("count").textContent = n + " / " + S.length;
  document.getElementById("fill").style.width = (n / S.length * 100) + "%";
}

function toggle(i){
  const k = key(i);
  if (filmed[k]) delete filmed[k]; else filmed[k] = true;
  draw();
  if (ref) ref.set({ filmed: filmed }).catch(() => {
    document.getElementById("note").textContent = "That didn't save. Your marks are showing but they won't survive a reload.";
  });
}

document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
};

drawChips();
draw();

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db){
    document.getElementById("note").textContent = "Filmed marks won't save in this view, so they'll clear when you reload.";
    return;
  }
  ref = db.doc(DECK);
  ref.onSnapshot(
    snap => {
      const data = snap.exists ? snap.data() : null;
      filmed = (data && data.filmed && typeof data.filmed === "object") ? Object.assign({}, data.filmed) : {};
      draw();
    },
    () => { document.getElementById("note").textContent = "Lost the connection to your saved marks. Reload to try again."; }
  );
})();
</script>
